# research1 foundation package. Harbor / ModularRSI stay outside this repo;
# adapters call the upstream checkout. Secrets never live here.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "long-horizon-credit-harness-evolution"
version = "0.1.0"
description = "Stable Harness Evolution via Long-Horizon Credit Assignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
research1 = "research1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["research1*"]
