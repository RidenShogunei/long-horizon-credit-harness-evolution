# ModularRSI method reproduction: 8-task full self-evo pass (Tongji).
# Does NOT replace smoke tools/verification configs. Upstream ModularRSI READ-ONLY.
#
# Workload intent (official phase0 semantics):
#   - slice train[:8], then TASK_SEED shuffle each epoch
#   - epochs=1 (one full pass; enough for mid-run reflect + post-promote load)
#   - reflect_every=4 → two reflection windows on 8 completed tasks
#   - attempts=3, locked_module=verification (from tools-smoke attribution)
#   - PROFILE=train so defaults are not smoke's max_tasks=2; MAX_TASKS overrides to 8
protocol_id: research1-v1

modularrsi_root: /home/jinxu/arms_cache/modularrsi/ModularRSI
modules_root: /home/jinxu/arms_cache/modularrsi/ModularRSI/generations/merged_active/gen_0/modules
dataset_root: /home/jinxu/arms_cache/modularrsi/ModularRSI_2000_Instances
dataset_tb: /home/jinxu/arms_cache/modularrsi/ModularRSI_2000_Instances/tb
h0_snapshot: configs/h0.snapshot.v0.json
h0_lock: configs/research1/h0.lock.json
tasks_lock: configs/research1/n8_full.lock.json
runs_root: runs
reports_root: reports

proxy_url: http://172.17.0.1:7890
disk_stop_gb_free: 15
provider_mode: tongji_agi

composer: static
upstream_commit: ed1e545bc60f050b404474e51ee18021777a0e23

LOCKED_MODULE: verification

# Official Phase0 workload overrides (see reports/modularrsi_full_n8_protocol.md)
modularrsi_profile: train
modularrsi_max_tasks: 8
modularrsi_epochs: 1
modularrsi_reflect_every: 4
modularrsi_task_concurrency: 2
modularrsi_attempts: 3
modularrsi_task_seed: 0

p2a_solver_temperature: 0.0
p2b_solver_temperature: 0.7
lambda: 0.5
regression_primary: parent-step

p2b_reps: 2
p2b_tasks:
  - cron-env-debug
  - browser-playable-leaderboard

rails:
  modularrsi_run_prefix: modularrsi_
  branches_run_prefix: branches_
